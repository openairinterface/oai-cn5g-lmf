## LMF configuration file
LMF =
{
  INSTANCE_ID = @INSTANCE_ID@;
  PID_DIRECTORY = "@PID_DIR@";
  LMF_NAME = "@LMF_NAME@";

  INTERFACES:{
    # LMF binded interface for SBI interface (e.g., communication with AMF)
    SBI:{
        INTERFACE_NAME = "@SBI_IF_NAME@";      # YOUR NETWORK CONFIG HERE
        IPV4_ADDRESS   = "read";
        PORT           = @SBI_PORT@;           # YOUR NETWORK CONFIG HERE (default: 80)
        API_VERSION    = "@SBI_API_VERSION@";  # YOUR API VERSION FOR UDM CONFIG HERE
        HTTP2_PORT     = @SBI_HTTP2_PORT@;     # YOUR NETWORK CONFIG HERE
    };
  };

  # SUPPORT FEATURES
  SUPPORT_FEATURES:{
    # STRING, {"yes", "no"}, 
    USE_FQDN_DNS = "@USE_FQDN_DNS@";    # Set to yes if LMF will relying on a DNS to resolve UDM's FQDN
    USE_HTTP2    = "@USE_HTTP2@";                 # Set to yes to enable HTTP2 for AMF server
    REGISTER_NRF = "@REGISTER_NRF@";    # Set to 'yes' if LMF resgisters to an NRF
  }  

  AMF:{
    IPV4_ADDRESS   = "@AMF_IP_ADDRESS@";  # YOUR NETWORK CONFIG HERE
    PORT           = @AMF_PORT@;          # YOUR NETWORK CONFIG HERE  (default: 80)
    API_VERSION    = "@AMF_VERSION_NB@";  # YOUR API VERSION FOR UDM CONFIG HERE
    FQDN           = "@AMF_FQDN@"         # YOUR AMF FQDN CONFIG HERE
  };
  
  NRF :
  {
    IPV4_ADDRESS = "@NRF_IPV4_ADDRESS@";  # YOUR NRF CONFIG HERE
    PORT         = @NRF_PORT@;            # YOUR NRF CONFIG HERE (default: 80)
    API_VERSION  = "@NRF_API_VERSION@";   # YOUR NRF API VERSION HERE
    FQDN = "@NRF_FQDN@";
  };
};
